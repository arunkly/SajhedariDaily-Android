name: Sajhedari Daily Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SajhedariDaily-Android-Phase8-EPAPER-INTEGRATION.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu images already include Android command-line tools.
      # Avoid android-actions/setup-android@v3 here: it requests the removed
      # legacy SDK package "tools", which makes sdkmanager exit with code 1.
      - name: Configure Android SDK command-line tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept licenses and install required SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Phase 8 project
        run: |
          test -f SajhedariDaily-Android-Phase8-EPAPER-INTEGRATION.zip
          mkdir -p build-source
          unzip -q SajhedariDaily-Android-Phase8-EPAPER-INTEGRATION.zip -d build-source
          test -f build-source/SajhedariDaily-Android-Phase1/settings.gradle.kts

      - name: Patch Kotlin DSL java.util name collision
        working-directory: build-source/SajhedariDaily-Android-Phase1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('plugins {', 'import java.util.Properties\n\nplugins {', 1)
          s = s.replace('java.util.Properties()', 'Properties()')
          p.write_text(s)
          PY

      - name: Install on-device crash diagnostics
        working-directory: build-source/SajhedariDaily-Android-Phase1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main")
          pkg = base / "java/com/sajhedaridaily/news"
          pkg.mkdir(parents=True, exist_ok=True)
          (pkg / "SajhedariApplication.kt").write_text("""package com.sajhedaridaily.news

          import android.app.Application
          import android.os.Process
          import java.io.File
          import java.util.Date
          import kotlin.system.exitProcess

          class SajhedariApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          File(filesDir, "sajhedari-last-crash.txt").writeText(
                              "Sajhedari Daily crash report\\nTime: ${Date()}\\nThread: ${thread.name}\\n\\n" +
                                  error.stackTraceToString()
                          )
                      } catch (_: Exception) { }
                      if (previous != null) previous.uncaughtException(thread, error)
                      else {
                          Process.killProcess(Process.myPid())
                          exitProcess(10)
                      }
                  }
              }
          }
          """)
          manifest = base / "AndroidManifest.xml"
          m = manifest.read_text()
          m = m.replace('<application', '<application android:name=".SajhedariApplication"', 1)
          manifest.write_text(m)

          activity = pkg / "MainActivity.kt"
          s = activity.read_text()
          old = '        setContent { SajhedariTheme { SajhedariApp() } }'
          new = '''        window.decorView.post {
                      val crashFile = java.io.File(filesDir, "sajhedari-last-crash.txt")
                      if (crashFile.exists()) {
                          android.app.AlertDialog.Builder(this)
                              .setTitle("Sajhedari Daily crash report")
                              .setMessage("The previous app session stopped unexpectedly. Share the diagnostic report so the issue can be fixed.")
                              .setPositiveButton("Share report") { _, _ ->
                                  val share = Intent(Intent.ACTION_SEND).apply {
                                      type = "text/plain"
                                      putExtra(Intent.EXTRA_SUBJECT, "Sajhedari Daily crash report")
                                      putExtra(Intent.EXTRA_TEXT, crashFile.readText())
                                  }
                                  startActivity(Intent.createChooser(share, "Send crash report"))
                                  crashFile.delete()
                              }
                              .setNegativeButton("Not now") { _, _ -> crashFile.delete() }
                              .show()
                      }
                  }
                  setContent { SajhedariTheme { SajhedariApp() } }'''
          if old not in s:
              raise SystemExit("Could not find MainActivity setContent insertion point")
          activity.write_text(s.replace(old, new, 1))
          PY

      - name: Build debug APK
        working-directory: build-source/SajhedariDaily-Android-Phase1
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SajhedariDaily-debug-apk
          path: build-source/SajhedariDaily-Android-Phase1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
